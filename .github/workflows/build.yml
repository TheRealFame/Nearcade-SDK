name: Build & Release

on:
  push:
    branches: [main, engine-integrations]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 0.2.0)
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build per platform ──────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            arch: linux-x86_64
            sdk_lib: libnearcade.so
            signaling: ON
          - os: windows-latest
            arch: windows-x86_64
            sdk_lib: Release/nearcade.dll
            signaling: OFF
          - os: macos-latest
            arch: macos-universal
            sdk_lib: libnearcade.dylib
            signaling: OFF

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libssl-dev libwebsockets-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libwebsockets

      - name: Configure SDK
        run: cmake -B build_sdk -DNEARCADE_BUILD_SHARED=ON -DNEARCADE_BUILD_SIGNALING=${{ matrix.signaling }} -DNEARCADE_BUILD_WEBRTC=ON -DNEARCADE_BUILD_TESTS=OFF "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" -DCMAKE_BUILD_TYPE=Release

      - name: Build SDK
        run: cmake --build build_sdk --config Release -j4

      - name: Configure GDExtension
        continue-on-error: true
        run: cmake -B build_godot -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build_sdk -DCMAKE_BUILD_TYPE=Release bindings/godot

      - name: Build GDExtension
        continue-on-error: true
        run: cmake --build build_godot --config Release -j4

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p staging/lib staging/include staging/godot

          if [ -f "build_sdk/libnearcade.so" ]; then
            cp build_sdk/libnearcade.so staging/lib/
          elif [ -f "build_sdk/libnearcade.dylib" ]; then
            cp build_sdk/libnearcade.dylib staging/lib/
          elif [ -f "build_sdk/Release/nearcade.dll" ]; then
            cp build_sdk/Release/nearcade.dll staging/lib/
            cp build_sdk/Release/nearcade.lib  staging/lib/ 2>/dev/null || true
          fi

          cp include/nearcade.h staging/include/

          if ls build_godot/demo/addons/nearcade/bin/* 2>/dev/null; then
            cp build_godot/demo/addons/nearcade/bin/* staging/godot/
          fi

      - name: Upload SDK (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.arch }}
          path: staging/
          if-no-files-found: error

  # ── Package + Create Release ───────────────────────────────────────────
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "ver=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VER=$(grep 'project(nearcade VERSION' CMakeLists.txt | sed 's/.*VERSION \([0-9.]*\).*/\1/')
            echo "tag=v${VER}" >> $GITHUB_OUTPUT
            echo "ver=${VER}" >> $GITHUB_OUTPUT
          fi

      - name: Create per-platform SDK zips
        shell: bash
        run: |
          ver="${{ steps.version.outputs.ver }}"
          for dir in sdk-*/; do
            arch="${dir#sdk-}"
            arch="${arch%/}"
            pkg="nearcade-sdk-v${ver}-${arch}"
            mkdir -p "${pkg}/lib" "${pkg}/include"
            cp "$dir/lib/"* "${pkg}/lib/"
            cp "$dir/include/"* "${pkg}/include/"
            zip -r "${pkg}.zip" "${pkg}"
          done

      - name: Create Godot addon zip (all platforms)
        shell: bash
        run: |
          ver="${{ steps.version.outputs.ver }}"
          addon_dir="nearcade-godot-v${ver}/addons/nearcade"
          mkdir -p "${addon_dir}/bin"

          cp bindings/godot/demo/addons/nearcade/nearcade.gdextension "${addon_dir}/"

          for dir in sdk-*/; do
            if ls "$dir/godot/"* 2>/dev/null; then
              cp "$dir/godot/"* "${addon_dir}/bin/"
            fi
            cp "$dir/lib/"* "${addon_dir}/bin/" 2>/dev/null || true
          done

          zip -r "nearcade-godot-v${ver}.zip" "nearcade-godot-v${ver}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            ## Nearcade SDK ${{ steps.version.outputs.tag }}

            Automated build. See [CHANGES](../../blob/${{ steps.version.outputs.tag }}/README.md) for details.

            ### Contents

            - **nearcade-sdk-v${{ steps.version.outputs.ver }}-linux-x86_64.zip** — C headers + libnearcade.so
            - **nearcade-sdk-v${{ steps.version.outputs.ver }}-windows-x86_64.zip** — C headers + nearcade.dll + .lib
            - **nearcade-sdk-v${{ steps.version.outputs.ver }}-macos-universal.zip** — C headers + libnearcade.dylib
            - **nearcade-godot-v${{ steps.version.outputs.ver }}.zip** — Godot 4.6 addon (all platforms)
          files: |
            nearcade-sdk-v*.zip
            nearcade-godot-v*.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
